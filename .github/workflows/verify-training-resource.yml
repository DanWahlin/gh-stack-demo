name: Verify training resource

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * 1"
  pull_request:
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "src/**"
      - "test/**"
      - "github-stacked-prs.pptx"
      - ".github/workflows/verify-training-resource.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "package.json"
      - "src/**"
      - "test/**"
      - "github-stacked-prs.pptx"
      - ".github/workflows/verify-training-resource.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation-and-canonical-pr-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check documentation
        run: python scripts/check-docs.py

      - name: Check workshop copy script
        run: |
          bash -n scripts/create-workshop-copy.sh
          shellcheck scripts/create-workshop-copy.sh

      - name: Install gh-stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-stack

      - name: Verify gh-stack command contract
        run: python scripts/check-cli-contract.py

      - name: Verify the canonical live stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify-demo.py

  pull-request-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Test the proposed change
        run: npm test

  canonical-layer-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: tasks/model
            layer: model
          - branch: tasks/validation
            layer: validation
          - branch: tasks/api
            layer: complete stack
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run ${{ matrix.layer }} tests
        run: npm test
